<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1a2433;--mut:#5d6b7e;--pri:#0b5cab;--bd:#dde3ea;--hi:#e6f0fb;--wn:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#93a1b3;--pri:#5aa2ee;--bd:#2c3644;--hi:#1f3350;--wn:#3a3020}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#93a1b3;--pri:#5aa2ee;--bd:#2c3644;--hi:#1f3350;--wn:#3a3020}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2rem 0}
.sub{color:var(--mut);font-size:.85rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font-size:.95rem;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
.bar h2{font-size:1.1rem;margin:0}
label{font-size:.85rem;color:var(--mut);display:flex;gap:6px;align-items:center}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.78rem;text-transform:uppercase}
tr.hoje td{background:var(--hi);font-weight:600}
tr.fer td{background:var(--wn);color:var(--mut)}
.ead{font-size:.7rem;border:1px solid var(--pri);color:var(--pri);border-radius:6px;padding:1px 5px;margin-left:6px}
.msg{color:var(--mut);font-size:.9rem;padding:6px 0}
</style>
